name: Static load simplification checks

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  static-load-simplification:
    name: Static loads, crane boom and cut range
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-issue36
      cancel-in-progress: true
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Simulate fresh merge with latest base
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bash scripts/simulate-fresh-merge.sh
      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
      - name: Check issue #36 static-load model, horizontal boom and 1-48 cut range
        run: npm run test:issue36
      - name: Check JavaScript syntax
        run: npm run check
      - name: Check canonical modules are deployable
        shell: bash
        run: |
          set -euo pipefail
          test -s packages/engineering/src/crane-boom-capacity.js
          grep --quiet 'crane-boom-capacity.js' packages/application/src/complete-calculation.js
          grep --quiet 'craneBoomCapacity' apps/web/usage-scenarios.js
