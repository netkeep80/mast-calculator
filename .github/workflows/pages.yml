name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  build:
    name: Validate and package web app
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-build
      cancel-in-progress: true
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'

      - name: Check JavaScript syntax
        run: npm run check

      - name: Check portable canonical calculation
        run: npm run test:platform

      - name: Check file line limits
        run: node scripts/check-file-line-limits.mjs

      - name: Build static Pages tree
        run: npm run build:web

      - name: Add deployment metadata
        shell: bash
        run: |
          set -euo pipefail
          touch _site/.nojekyll
          cat > /tmp/build-info.json <<EOF
          {
            "repository": "${GITHUB_REPOSITORY}",
            "ref": "${GITHUB_REF}",
            "sha": "${GITHUB_SHA}",
            "runId": "${GITHUB_RUN_ID}"
          }
          EOF
          cp /tmp/build-info.json _site/build-info.json
          cp /tmp/build-info.json _site/apps/web/build-info.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Publish site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    concurrency:
      group: main-writer-${{ github.repository }}-pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
