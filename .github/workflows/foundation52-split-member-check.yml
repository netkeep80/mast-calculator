name: Foundation 52 member engineering split

on:
  pull_request:
    branches: [main]
    types: [synchronize, ready_for_review]

permissions:
  contents: read

env:
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  split:
    if: github.head_ref == 'agent/issue-52-headless-core'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v6
        with:
          ref: agent/issue-52-headless-core
          fetch-depth: 0
      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
      - name: Split member engineering from structural solver
        run: node scripts/foundation52-split-member-check.mjs
      - name: Commit source split
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages apps/web/guys-app.js tests/guy-wires-issue23.test.js tests/package-entrypoints.test.js scripts/generate-canonical-baseline.mjs
          git commit -m "Separate structural response from member engineering checks"
          git push origin HEAD:agent/issue-52-headless-core
