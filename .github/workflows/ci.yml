name: Pull request checks

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  quality:
    name: Syntax, types and maintainability
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-quality
      cancel-in-progress: true
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Simulate fresh merge with latest base
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bash scripts/simulate-fresh-merge.sh
      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
      - name: Check JavaScript syntax
        run: npm run check
      - name: Typecheck canonical TypeScript
        run: npm run typecheck
      - name: Enforce maintainability budgets
        run: node scripts/check-file-line-limits.mjs

  security:
    name: Secrets scan
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-security
      cancel-in-progress: true
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
      - name: Run secretlint
        run: npx --yes -p secretlint -p @secretlint/secretlint-rule-preset-recommend secretlint --secretlintignore .gitignore "**/*"

  regression:
    name: Functional and numerical regression
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-regression
      cancel-in-progress: true
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Simulate fresh merge with latest base
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bash scripts/simulate-fresh-merge.sh
      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
      - name: Run complete functional test suite once
        run: npm test

  performance:
    name: Performance budgets
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-performance
      cancel-in-progress: true
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Simulate fresh merge with latest base
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bash scripts/simulate-fresh-merge.sh
      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
      - name: Run engineering performance guard
        run: npm run test:performance
      - name: Check Web and generated-artifact budgets
        run: node scripts/check-build-budgets.mjs

  platform-equivalence:
    name: Canonical equivalence (${{ matrix.os }})
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-platform-${{ matrix.os }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Simulate fresh merge with latest base
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bash scripts/simulate-fresh-merge.sh
      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
      - name: Compare canonical engineering baseline on this OS
        run: npm run test:platform

  static-site:
    name: Web integration smoke
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-static-site
      cancel-in-progress: true
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Simulate fresh merge with latest base
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bash scripts/simulate-fresh-merge.sh
      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
      - name: Build static web tree
        run: npm run build:web
      - name: Smoke-test browser entry points and package APIs
        shell: bash
        run: |
          set -euo pipefail
          assert_contains() {
            local file="$1"
            local needle="$2"
            local label="$3"
            if ! grep --fixed-strings --quiet -- "$needle" "$file"; then
              echo "::error::$label: expected '$needle' in $file"
              exit 1
            fi
          }
          assert_not_contains() {
            local file="$1"
            local needle="$2"
            local label="$3"
            if grep --fixed-strings --quiet -- "$needle" "$file"; then
              echo "::error::$label: unexpected '$needle' in $file"
              exit 1
            fi
          }
          assert_asset() {
            local path="$1"
            if ! curl --fail --silent "http://127.0.0.1:4173/$path" >/dev/null; then
              echo "::error::Web smoke asset is missing: $path"
              exit 1
            fi
          }

          python3 -m http.server 4173 --directory _site >/tmp/mast-calculator-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT

          loaded=false
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/tmp/mast-calculator-index.html; then
              loaded=true
              break
            fi
            sleep 0.25
          done
          if [[ "$loaded" != true ]]; then
            cat /tmp/mast-calculator-http.log
            exit 1
          fi

          assert_contains /tmp/mast-calculator-index.html '<title>Калькулятор мачты</title>' 'main page title changed'
          assert_contains /tmp/mast-calculator-index.html '<body data-web-ui="2.0">' 'Web UI 2.0 marker is missing'
          assert_contains /tmp/mast-calculator-index.html 'class="app-bar"' 'canonical app bar is missing'
          assert_contains /tmp/mast-calculator-index.html 'workspace-project-pane' 'project workspace is missing'
          assert_contains /tmp/mast-calculator-index.html 'workspace-view-pane' '3D workspace is missing'
          assert_contains /tmp/mast-calculator-index.html 'workspace-summary-pane' 'engineering summary workspace is missing'
          assert_contains /tmp/mast-calculator-index.html 'Справочники — проверить исходные значения расчёта' 'reference-data entry point is missing'
          assert_not_contains /tmp/mast-calculator-index.html 'Что вы хотите узнать о мачте?' 'legacy scenario-first hero returned'
          assert_not_contains /tmp/mast-calculator-index.html 'прототип 1.' 'hardcoded prototype version returned'
          assert_not_contains /tmp/mast-calculator-index.html 'scenario-panel' 'legacy scenario landing returned'
          assert_not_contains /tmp/mast-calculator-index.html 'workflow-strip' 'legacy workflow strip returned'

          curl --fail --silent http://127.0.0.1:4173/design.html >/tmp/mast-design.html
          assert_contains /tmp/mast-design.html 'http-equiv="refresh" content="0; url=./#reports"' 'legacy design URL no longer redirects to Reports'
          assert_contains /tmp/mast-design.html 'href="./#reports"' 'legacy design page has no manual Reports fallback'

          for asset in \
            logo.jpg \
            apps/web/app.js \
            apps/web/app-bootstrap.js \
            apps/web/workspace-behavior.js \
            apps/web/workspace.css \
            apps/web/calculation-worker.js \
            apps/web/viewer.js \
            apps/web/joint-viewer.js \
            apps/web/result-tabs.js \
            apps/web/result-tabs.css \
            apps/web/guy-result-panel.css \
            apps/web/reports-exports.js \
            apps/web/reports-exports.css \
            packages/domain/index.js \
            packages/numerics/index.js \
            packages/structural-analysis/index.js \
            packages/engineering/index.js \
            packages/application/index.js \
            packages/design/index.js \
            packages/reporting/index.js
          do
            assert_asset "$asset"
          done

          for removed in \
            apps/web/workspace-shell.js \
            apps/web/procurement-export.js \
            apps/web/design-storage.js \
            apps/web/navigation.js
          do
            if curl --fail --silent "http://127.0.0.1:4173/$removed" >/dev/null; then
              echo "::error::Legacy Web asset is still published: $removed"
              exit 1
            fi
          done
