name: 3D and construction documentation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  design-workspace:
    name: Design workspace, ESKD and OBJ
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-design
      cancel-in-progress: true
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Simulate fresh merge with latest base
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bash scripts/simulate-fresh-merge.sh

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'

      - name: Check design package, shared 3D, OBJ and ESKD
        run: npm run test:design

      - name: Smoke-test separate design page
        shell: bash
        run: |
          set -euo pipefail
          cp logo.jpg site/logo.jpg
          python3 -m http.server 4174 --directory site >/tmp/mast-design-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT

          loaded=false
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4174/design.html >/tmp/mast-design.html; then
              loaded=true
              break
            fi
            sleep 0.25
          done
          if [[ "$loaded" != true ]]; then
            cat /tmp/mast-design-http.log
            exit 1
          fi

          grep --quiet '<title>3D и конструкторская документация мачты</title>' /tmp/mast-design.html
          grep --quiet 'Модуль 3D и конструкторской документации' /tmp/mast-design.html
          grep --quiet 'Скачать КД по ЕСКД' /tmp/mast-design.html
          curl --fail --silent http://127.0.0.1:4174/design-app.js >/dev/null
          curl --fail --silent http://127.0.0.1:4174/design.css >/dev/null
          curl --fail --silent http://127.0.0.1:4174/viewer.js >/dev/null
          curl --fail --silent http://127.0.0.1:4174/joint-viewer.js >/dev/null
          curl --fail --silent http://127.0.0.1:4174/engine/design-package.js >/dev/null
          curl --fail --silent http://127.0.0.1:4174/engine/detailed-mast-model.js >/dev/null
          curl --fail --silent http://127.0.0.1:4174/engine/technical-projection.js >/dev/null
          curl --fail --silent http://127.0.0.1:4174/engine/eskd-construction-documentation.js >/dev/null
          curl --fail --silent http://127.0.0.1:4174/engine/obj-export.js >/dev/null
