name: Canonical baseline bootstrap

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [agent/issue-51-regression-safety-net]
  workflow_dispatch:

permissions:
  contents: read

env:
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  generate:
    name: Generate canonical baseline candidate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
      - name: Generate baseline candidate
        run: node scripts/generate-canonical-baseline.mjs
