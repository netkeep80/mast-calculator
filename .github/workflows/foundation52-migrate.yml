name: Foundation 52 one-shot migration

on:
  push:
    branches: [agent/issue-52-headless-core]

permissions:
  contents: read

env:
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  migrate:
    if: github.event.head_commit.message == 'Run one-shot headless core migration'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v6
        with:
          ref: agent/issue-52-headless-core
          fetch-depth: 0
      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
      - name: Apply canonical layout migration
        run: node scripts/foundation52-migrate.mjs
      - name: Remove one-shot migration machinery
        shell: bash
        run: rm scripts/foundation52-migrate.mjs .github/workflows/foundation52-migrate.yml
      - name: Commit migrated tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply headless core source layout"
          git push origin HEAD:agent/issue-52-headless-core
