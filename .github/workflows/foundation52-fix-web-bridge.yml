name: Foundation 52 Web bridge cleanup

on:
  pull_request:
    branches: [main]
    types: [ready_for_review]

permissions:
  contents: read

env:
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  fix:
    if: github.head_ref == 'agent/issue-52-headless-core'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v6
        with:
          ref: agent/issue-52-headless-core
          fetch-depth: 0
      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
      - name: Fix Web bridge imports
        run: node scripts/foundation52-fix-web-bridge.mjs
      - name: Commit Web bridge fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/usage-scenarios.js
          git commit -m "Route design persistence through Web adapter"
          git push origin HEAD:agent/issue-52-headless-core
