name: Pull request checks

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  quality:
    name: Syntax, types and maintainability
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-quality
      cancel-in-progress: true
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Simulate fresh merge with latest base
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bash scripts/simulate-fresh-merge.sh
      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
      - name: Check JavaScript syntax
        run: npm run check
      - name: Typecheck canonical TypeScript
        run: npm run typecheck
      - name: Enforce maintainability budgets
        run: node scripts/check-file-line-limits.mjs

  security:
    name: Secrets scan
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-security
      cancel-in-progress: true
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
      - name: Run secretlint
        run: npx --yes -p secretlint -p @secretlint/secretlint-rule-preset-recommend secretlint --secretlintignore .gitignore "**/*"

  regression:
    name: Functional and numerical regression
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-regression
      cancel-in-progress: true
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Simulate fresh merge with latest base
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bash scripts/simulate-fresh-merge.sh
      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
      - name: Run complete functional test suite once
        run: npm test

  performance:
    name: Performance budgets
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-performance
      cancel-in-progress: true
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Simulate fresh merge with latest base
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bash scripts/simulate-fresh-merge.sh
      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
      - name: Run engineering performance guard
        run: npm run test:performance
      - name: Check Web and generated-artifact budgets
        run: node scripts/check-build-budgets.mjs

  platform-equivalence:
    name: Canonical equivalence (${{ matrix.os }})
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-platform-${{ matrix.os }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Simulate fresh merge with latest base
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bash scripts/simulate-fresh-merge.sh
      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
      - name: Compare canonical engineering baseline on this OS
        run: npm run test:platform

  static-site:
    name: Web integration smoke
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-static-site
      cancel-in-progress: true
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Simulate fresh merge with latest base
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bash scripts/simulate-fresh-merge.sh
      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
      - name: Build static web tree
        run: npm run build:web
      - name: Smoke-test browser entry points and package APIs
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory _site >/tmp/mast-calculator-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT

          loaded=false
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/tmp/mast-calculator-index.html; then
              loaded=true
              break
            fi
            sleep 0.25
          done
          if [[ "$loaded" != true ]]; then
            cat /tmp/mast-calculator-http.log
            exit 1
          fi

          grep --quiet '<title>Калькулятор мачты</title>' /tmp/mast-calculator-index.html
          grep --quiet 'Проверить конкретную мачту' /tmp/mast-calculator-index.html
          grep --quiet 'Справочники — проверить исходные значения расчёта' /tmp/mast-calculator-index.html
          curl --fail --silent http://127.0.0.1:4173/logo.jpg >/dev/null
          curl --fail --silent http://127.0.0.1:4173/apps/web/app.js >/dev/null
          curl --fail --silent http://127.0.0.1:4173/apps/web/calculation-worker.js >/dev/null
          curl --fail --silent http://127.0.0.1:4173/apps/web/viewer.js >/dev/null
          curl --fail --silent http://127.0.0.1:4173/apps/web/design-app.js >/dev/null
          curl --fail --silent http://127.0.0.1:4173/apps/web/design-storage.js >/dev/null
          curl --fail --silent http://127.0.0.1:4173/packages/domain/index.js >/dev/null
          curl --fail --silent http://127.0.0.1:4173/packages/numerics/index.js >/dev/null
          curl --fail --silent http://127.0.0.1:4173/packages/structural-analysis/index.js >/dev/null
          curl --fail --silent http://127.0.0.1:4173/packages/engineering/index.js >/dev/null
          curl --fail --silent http://127.0.0.1:4173/packages/application/index.js >/dev/null
          curl --fail --silent http://127.0.0.1:4173/packages/design/index.js >/dev/null
          curl --fail --silent http://127.0.0.1:4173/packages/reporting/index.js >/dev/null
