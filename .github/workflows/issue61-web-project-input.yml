name: Issue 61 Web contract cleanup

on:
  pull_request:
    branches: [main]
    types: [synchronize, reopened]

permissions:
  contents: write

env:
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  cleanup-web-contract:
    if: github.head_ref == 'agent/issue-61-contracts'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout contracts branch
        uses: actions/checkout@v6
        with:
          ref: agent/issue-61-contracts
          fetch-depth: 0
      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
      - name: Remove dead Web controls and runtime migration
        run: node scripts/issue61-web-contract-cleanup.mjs
      - name: Check cleaned adapter syntax
        run: node --check apps/web/usage-scenarios.js
      - name: Prove canonical physics and Web-sensitive regressions
        run: npm run test:headless && npm run test:canonical && npm run test:issue36 && npm run test:ux
      - name: Commit cleanup and remove one-shot tooling
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/index.html apps/web/usage-scenarios.js tests/static-load-simplification-issue36.test.js
          git rm scripts/issue61-web-contract-cleanup.mjs .github/workflows/issue61-web-project-input.yml
          git commit -m "Remove legacy Web contract fields"
          git push origin HEAD:agent/issue-61-contracts
