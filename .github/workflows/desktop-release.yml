name: Desktop release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build unsigned Desktop release (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-appimage
            os: ubuntu-22.04
            bundle: appimage
          - label: windows-nsis
            os: windows-latest
            bundle: nsis
          - label: macos-app
            os: macos-latest
            bundle: app
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Checkout release source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
      - name: Generate cross-platform desktop icons
        run: npm run prepare:desktop:icons
      - name: Install Linux Tauri prerequisites
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - name: Build canonical Desktop WebView assets
        run: npm run build:desktop:web
      - name: Build unsigned Tauri bundle
        working-directory: apps/desktop
        run: npx --yes @tauri-apps/cli@2.11.4 build --bundles ${{ matrix.bundle }}
      - name: Stage Linux release asset
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p release-assets
          cp apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage \
            release-assets/mast-calculator-linux.AppImage
      - name: Stage Windows release asset
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-assets | Out-Null
          $installer = Get-ChildItem 'apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe' | Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer was not produced' }
          Copy-Item $installer.FullName 'release-assets/mast-calculator-windows-setup.exe'
      - name: Stage macOS release asset
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p release-assets
          app_path="$(find apps/desktop/src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$app_path"
          ditto -c -k --sequesterRsrc --keepParent "$app_path" \
            release-assets/mast-calculator-macos.app.zip
      - name: Upload staged release asset
        uses: actions/upload-artifact@v7
        with:
          name: desktop-release-${{ matrix.label }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Attach Desktop artifacts to GitHub Release
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download staged release assets
        uses: actions/download-artifact@v7
        with:
          pattern: desktop-release-*
          path: release-assets
          merge-multiple: true
      - name: Publish unsigned Desktop assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" release-assets/* --clobber
