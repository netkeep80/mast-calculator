name: Joint strength checks

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  joint-strength:
    name: Joint strength and visualization
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-joint-strength
      cancel-in-progress: true
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Simulate fresh merge with latest base
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bash scripts/simulate-fresh-merge.sh
      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
      - name: Check nut sections, weld area, preload, bolt shear and 3D geometry
        run: npm run test:joint-strength
