name: CLI checks

on:
  pull_request:
    paths:
      - 'apps/cli/**'
      - 'packages/application/**'
      - 'packages/domain/**'
      - 'tests/cli-oracle.test.js'
      - 'package.json'
      - '.github/workflows/cli.yml'
  push:
    branches: [main]
    paths:
      - 'apps/cli/**'
      - 'packages/application/**'
      - 'packages/domain/**'
      - 'tests/cli-oracle.test.js'
      - 'package.json'
      - '.github/workflows/cli.yml'

permissions:
  contents: read

jobs:
  oracle:
    name: CLI oracle (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Check JavaScript syntax
        run: npm run check
      - name: Typecheck portable contracts
        run: npm run typecheck
      - name: Run CLI application oracle
        run: npm run test:cli
