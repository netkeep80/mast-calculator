name: Pull request checks

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  quality:
    name: Syntax, policy and maintainability
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-quality
      cancel-in-progress: true
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Simulate fresh merge with latest base
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bash scripts/simulate-fresh-merge.sh
      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
      - name: Check JavaScript syntax
        run: npm run check
      - name: Check file line limits
        run: node scripts/check-file-line-limits.mjs

  security:
    name: Secrets scan
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-security
      cancel-in-progress: true
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
      - name: Run secretlint
        run: npx --yes -p secretlint -p @secretlint/secretlint-rule-preset-recommend secretlint --secretlintignore .gitignore "**/*"

  triple-fem:
    name: Triple FEM equivalence
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-triple-fem
      cancel-in-progress: true
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Simulate fresh merge with latest base
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bash scripts/simulate-fresh-merge.sh
      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
      - name: Compare global, Schur and independent dense FEM
        run: npm run test:triple

  joint-configurator:
    name: Joint configurator
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-joint-configurator
      cancel-in-progress: true
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Simulate fresh merge with latest base
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bash scripts/simulate-fresh-merge.sh
      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
      - name: Check two-nut physical joint and automatic configuration
        run: npm run test:joint

  support-statics:
    name: Support reaction statics
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-support-statics
      cancel-in-progress: true
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Simulate fresh merge with latest base
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bash scripts/simulate-fresh-merge.sh
      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
      - name: Check analytical three-support reaction oracles
        run: npm run test:statics

  usage-ux:
    name: Usage scenarios and reference catalogs
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-usage-ux
      cancel-in-progress: true
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Simulate fresh merge with latest base
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bash scripts/simulate-fresh-merge.sh
      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
      - name: Check user scenarios, assembly mass and single-source catalogs
        run: npm run test:ux

  test:
    name: Tests (${{ matrix.os }})
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-test-${{ matrix.os }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Simulate fresh merge with latest base
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bash scripts/simulate-fresh-merge.sh
      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
      - name: Run complete test suite
        run: npm test

  static-site:
    name: Static site smoke test
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-static-site
      cancel-in-progress: true
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Simulate fresh merge with latest base
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bash scripts/simulate-fresh-merge.sh
      - name: Smoke-test browser entry points
        shell: bash
        run: |
          set -euo pipefail
          cp logo.jpg site/logo.jpg
          python3 -m http.server 4173 --directory site >/tmp/mast-calculator-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT

          loaded=false
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/tmp/mast-calculator-index.html; then
              loaded=true
              break
            fi
            sleep 0.25
          done
          if [[ "$loaded" != true ]]; then
            cat /tmp/mast-calculator-http.log
            exit 1
          fi

          grep --quiet '<title>Калькулятор мачты</title>' /tmp/mast-calculator-index.html
          grep --quiet 'Проверить конкретную мачту' /tmp/mast-calculator-index.html
          grep --quiet 'Справочники — проверить исходные значения расчёта' /tmp/mast-calculator-index.html
          curl --fail --silent http://127.0.0.1:4173/logo.jpg >/dev/null
          curl --fail --silent http://127.0.0.1:4173/app-bootstrap.js >/dev/null
          curl --fail --silent http://127.0.0.1:4173/app.js >/dev/null
          curl --fail --silent http://127.0.0.1:4173/usage-scenarios.js >/dev/null
          curl --fail --silent http://127.0.0.1:4173/usage-style.js >/dev/null
          curl --fail --silent http://127.0.0.1:4173/usage.css >/dev/null
          curl --fail --silent http://127.0.0.1:4173/reference-catalog.js >/dev/null
          curl --fail --silent http://127.0.0.1:4173/calculation-worker.js >/dev/null
          curl --fail --silent http://127.0.0.1:4173/viewer.js >/dev/null
          curl --fail --silent http://127.0.0.1:4173/module-viewer.js >/dev/null
          curl --fail --silent http://127.0.0.1:4173/joint-viewer.js >/dev/null
          curl --fail --silent http://127.0.0.1:4173/engine/calculate.js >/dev/null
          curl --fail --silent http://127.0.0.1:4173/engine/complete-calculation.js >/dev/null
          curl --fail --silent http://127.0.0.1:4173/engine/assembly-mass.js >/dev/null
          curl --fail --silent http://127.0.0.1:4173/engine/reference-data.js >/dev/null
          curl --fail --silent http://127.0.0.1:4173/engine/solver.js >/dev/null
          curl --fail --silent http://127.0.0.1:4173/engine/reference-frame.js >/dev/null
          curl --fail --silent http://127.0.0.1:4173/engine/module-stack.js >/dev/null
          curl --fail --silent http://127.0.0.1:4173/engine/module-verification.js >/dev/null
          curl --fail --silent http://127.0.0.1:4173/engine/banded.js >/dev/null
          curl --fail --silent http://127.0.0.1:4173/engine/buckling.js >/dev/null
          curl --fail --silent http://127.0.0.1:4173/engine/weather.js >/dev/null
          curl --fail --silent http://127.0.0.1:4173/engine/connection-catalog.js >/dev/null
          curl --fail --silent http://127.0.0.1:4173/engine/joint-hardware-catalog.js >/dev/null
          curl --fail --silent http://127.0.0.1:4173/engine/joint-configurator.js >/dev/null
          curl --fail --silent http://127.0.0.1:4173/engine/bolt-check.js >/dev/null
          curl --fail --silent http://127.0.0.1:4173/engine/weld-check.js >/dev/null
          curl --fail --silent http://127.0.0.1:4173/engine/joint-demand.js >/dev/null
          curl --fail --silent http://127.0.0.1:4173/engine/connection-check.js >/dev/null
          curl --fail --silent http://127.0.0.1:4173/engine/lateral-capacity.js >/dev/null
          curl --fail --silent http://127.0.0.1:4173/engine/static-payload-capacity.js >/dev/null
          curl --fail --silent http://127.0.0.1:4173/engine/verification.js >/dev/null
          curl --fail --silent http://127.0.0.1:4173/engine/calculation-note.js >/dev/null
          curl --fail --silent http://127.0.0.1:4173/engine/calculation-project.js >/dev/null
          curl --fail --silent http://127.0.0.1:4173/styles.css >/dev/null
