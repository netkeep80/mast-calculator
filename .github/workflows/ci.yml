name: Pull request checks

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit, syntax and static-site checks
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run unit tests
        run: npm test

      - name: Check JavaScript syntax
        run: npm run check

      - name: Smoke-test static site
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory site >/tmp/mast-calculator-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT

          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/tmp/mast-calculator-index.html; then
              break
            fi
            sleep 0.25
          done

          grep --quiet '<title>Mast Calculator</title>' /tmp/mast-calculator-index.html
          curl --fail --silent http://127.0.0.1:4173/app.js >/dev/null
          curl --fail --silent http://127.0.0.1:4173/engine/calculate.js >/dev/null
          curl --fail --silent http://127.0.0.1:4173/styles.css >/dev/null
